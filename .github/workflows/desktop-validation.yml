name: Desktop Validation

on:
  pull_request:
    branches: [main, phase-5-5-song-mode-verification]
  push:
    branches: [main, phase-5.5-hardening, phase-5-5-song-mode-verification, phase-11-release-parity-validation]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate Windows package
        run: npm run package:win:dir

      - name: Run packaged Windows runtime smoke test
        run: npm run smoke:win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-windows
          path: dist-electron
