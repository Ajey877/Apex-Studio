name: Desktop Validation

on:
  pull_request:
    branches: [main, phase-5-5-song-mode-verification]
  push:
    branches: [main, phase-5.5-hardening, phase-5-5-song-mode-verification, phase-11-release-parity-validation, arena/1862dfca-apex-studio]

permissions:
  contents: read

jobs:
  windows-package:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[rezfilter-diagnostic]')
    timeout-minutes: 30
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Audio regression tests
        run: npm run test:audio

      - name: History regression tests
        run: npm run test:history

      - name: Production build
        run: npm run build

      - name: Validate Windows package
        run: npm run package:win:dir

      - name: Verify production native DAW integration on Windows
        run: npm run test:vst3-daw

      - name: Run packaged Windows runtime smoke test
        run: npm run smoke:win

      - name: Publish Mixer deadline evidence summary
        if: always()
        shell: pwsh
        run: |
          $files = @(
            'build/native-evidence/apex-packaged-smoke-save.json',
            'build/native-evidence/apex-packaged-smoke-reopen.json',
            'build/native-evidence/apex-packaged-smoke.json'
          )
          $found = $false
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { continue }
            $found = $true
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Packaged Mixer smoke evidence ``$file``"
            $raw = Get-Content -Raw $file
            $startToken = 'deadlineFrameSlack='
            $endToken = '; bounded production timing evidence='
            $message = $raw
            try {
              $parsed = $raw | ConvertFrom-Json
              if ($parsed.smokeError) { $message = [string]$parsed.smokeError }
            } catch { }
            $start = $message.IndexOf($startToken)
            $end = if ($start -ge 0) { $message.IndexOf($endToken, $start) } else { -1 }
            if ($start -ge 0 -and $end -gt $start) {
              $payload = $message.Substring($start + $startToken.Length, $end - $start - $startToken.Length)
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Frame-based slack is computed from AudioContext/Worklet frames or same-process clocks only.'
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```json'
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $payload
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
              $notice = $payload.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::notice title=Mixer-deadline-frame-slack::$notice"
            } elseif ($message -ne $raw) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('smokeError: ' + $message.Substring(0, [Math]::Min(4000, $message.Length)))
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Smoke JSON was written without a deadlineFrameSlack prefix; inspect the uploaded artifact.'
            }
          }
          if (-not $found) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'No packaged smoke evidence JSON was produced.'
            Write-Output '::warning title=Mixer-deadline-frame-slack::No packaged smoke evidence JSON was produced.'
          }

      - name: Upload measured production VST3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-packaged-vst3-evidence-${{ github.run_id }}
          path: build/native-evidence
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-windows
          path: dist-electron
