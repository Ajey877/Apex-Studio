name: Desktop Validation

on:
  pull_request:
    branches: [main, phase-5-5-song-mode-verification]
  push:
    branches: [main, phase-5.5-hardening, phase-5-5-song-mode-verification, phase-11-release-parity-validation]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Audio regression tests
        shell: bash
        env:
          # Node's own reporter is used because the job log is not always
          # retrievable; failures are lifted to annotations that name the test.
          NODE_OPTIONS: --test-reporter=spec
        run: |
          set +e
          npm run test:audio 2>&1 | tee audio-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^[[:space:]]*(not ok|✖)' audio-tests.log | head -8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: History regression tests
        run: npm run test:history

      - name: Production build
        run: npm run build

      - name: Validate Windows package
        run: npm run package:win:dir

      - name: Verify production native DAW integration on Windows
        run: npm run test:vst3-daw

      - name: Verify native VST3 editor session and recovery contract
        run: npm run test:vst3-editor

      - name: Prove editor/audio helper process separation with real PIDs
        run: npm run test:vst3-editor-process

      - name: Build the native helper and the genuine AGain VSTGUI editor fixture
        run: npm run native:vst3:build

      - name: Verify the AGain VSTGUI editor fixture was built and is discoverable
        run: node scripts/verify-native-editor-fixture.mjs

      - name: Run packaged Windows runtime smoke test
        run: npm run smoke:win

      - name: Packaged Windows live input PCM and recording acceptance (fake microphone)
        run: npm run test:live-input-packaged

      - name: Upload live input acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-packaged-live-input-evidence
          path: build/live-input-evidence
          if-no-files-found: warn

      # The evidence gap this closes: a REAL native VST3 session, already
      # processing audio through the real helper process during playback, must
      # survive live-input monitoring initialization on the same insert. Renderer
      # tests and simulated bridges cannot prove this, so it runs against the
      # packaged executable with the real MDA plugin and the OS process table.
      - name: Packaged native VST3 + live input coexistence acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 30
        env:
          APEX_NATIVE_MONITORING_RUNS: '5'
        run: npm run test:native-monitoring-packaged

      - name: Upload native VST3 + live input coexistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-packaged-native-monitoring-evidence
          path: build/native-monitoring-evidence
          if-no-files-found: warn

      # Packaged-application editor acceptance: Playwright drives the REAL packaged
      # exe (Mixer insert -> plug-in's own window), and native facts are read from
      # the OS process table. The display-scale row runs at real 125% and 150%;
      # rows that need a second monitor or a person are recorded NOT_VERIFIED.
      - name: Native VST3 editor acceptance through the packaged application
        id: packaged-editor-acceptance
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          # P9: lets the run set the real display scale to 125% and 150% (and put it
          # back). Without it the display-scale criterion is NOT_VERIFIED.
          APEX_P9_ALLOW_DISPLAY_CHANGES: '1'
        run: |
          set +e
          node scripts/packaged-editor-acceptance.mjs 2>&1 | tee packaged-editor-acceptance.log
          status=${PIPESTATUS[0]}
          echo "exit=$status"
          grep -E '^ACCEPTANCE-SUMMARY' packaged-editor-acceptance.log | head -1 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          grep -E '^(ACCEPTANCE-ERROR|FAIL-DETAIL|ACCEPTANCE-DETAIL)' packaged-editor-acceptance.log | head -12 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E '^(PASS|FAIL|NOT_VERIFIED)' packaged-editor-acceptance.log | head -10 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          # The script's own exit code is the verdict and must survive this step.
          # It used to be captured into `status` and then discarded by a final
          # `exit 0`, so with continue-on-error the step's outcome was ALWAYS success
          # and the verdict step below could never fail. A failing acceptance run was
          # therefore reported as a green Windows job. Recording it in $GITHUB_OUTPUT
          # is what carries it across the step boundary.
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ ! -f build/native-evidence/packaged-editor-acceptance.json ]; then
            echo "missing_evidence=true" >> "$GITHUB_OUTPUT"
            echo "::error::Packaged acceptance produced no evidence file"
          else
            echo "missing_evidence=false" >> "$GITHUB_OUTPUT"
          fi
          # Do not fail here: the artifact must still upload after a failure, and the
          # verdict step below is the single place that decides the job's outcome.
          exit 0
      - name: Record the packaged acceptance verdict
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Read through env so the workflow expression cannot silently evaluate the
          # step's (always-success) outcome instead of the script's exit code.
          ACCEPTANCE_EXIT_CODE: ${{ steps.packaged-editor-acceptance.outputs.exit_code }}
          ACCEPTANCE_MISSING_EVIDENCE: ${{ steps.packaged-editor-acceptance.outputs.missing_evidence }}
        run: |
          set -euo pipefail
          echo "packaged acceptance exit code: ${ACCEPTANCE_EXIT_CODE:-<none>}"
          # The evidence file is mandatory: a run that produced no evidence has not
          # proved anything, whatever its exit code says.
          if [ "${ACCEPTANCE_MISSING_EVIDENCE}" = "true" ]; then
            echo "::error::Packaged acceptance produced no evidence file; nothing was measured"
            exit 1
          fi
          if [ -z "${ACCEPTANCE_EXIT_CODE:-}" ]; then
            echo "::error::Packaged acceptance did not report an exit code; the step did not run to completion"
            exit 1
          fi
          # 0 means every verified criterion passed. 3 is the script's documented
          # "verified criteria all passed, some remain NOT_VERIFIED" code, which is
          # NOT a failure: multi-monitor needs a second display and stays reported as such.
          # Any other code means at least one criterion FAILED, or the harness itself
          # crashed, and the job must go red.
          if [ "$ACCEPTANCE_EXIT_CODE" -ne 0 ] && [ "$ACCEPTANCE_EXIT_CODE" -ne 3 ]; then
            echo "::error::Packaged editor acceptance failed (exit ${ACCEPTANCE_EXIT_CODE}); see the uploaded evidence"
            exit 1
          fi
          if [ "$ACCEPTANCE_EXIT_CODE" -eq 3 ]; then
            # Exit 3 means "verified criteria passed, some remain NOT_VERIFIED". Assert
            # that the evidence really does contain NOT_VERIFIED criteria before calling
            # it acceptable: a run that exited 3 without reporting any would mean those
            # criteria had been silently dropped or turned into passes.
            if ! grep -q '"NOT_VERIFIED"' build/native-evidence/packaged-editor-acceptance.json; then
              echo "::error::Packaged acceptance exited 3 but its evidence reports no NOT_VERIFIED criterion; the unverified rows were not reported"
              exit 1
            fi
            echo "::notice::Packaged acceptance passed every verified criterion; criteria requiring an interactive desktop remain NOT_VERIFIED (see the summary line)"
          else
            echo "::notice::Packaged editor acceptance passed every criterion; see packaged-editor-acceptance.json"
          fi
      - name: Upload measured production VST3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-packaged-vst3-evidence
          path: build/native-evidence
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-windows
          path: dist-electron
