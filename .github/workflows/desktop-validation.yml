name: Desktop Validation

on:
  pull_request:
    branches: [main, phase-5-5-song-mode-verification]
  push:
    branches: [main, phase-5.5-hardening, phase-5-5-song-mode-verification, phase-11-release-parity-validation, diag/packaged-rezfilter-parity-main]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Audio regression tests
        run: npm run test:audio

      - name: History regression tests
        run: npm run test:history

      - name: Production build
        run: npm run build

      - name: Validate Windows package
        run: npm run package:win:dir

      - name: Verify production native DAW integration on Windows
        run: npm run test:vst3-daw

      - name: Run packaged Windows runtime smoke test
        run: npm run smoke:win
      - name: Annotate packaged RezFilter parity evidence
        if: always()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'build/native-evidence';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.includes('rezfilter-parity')) : [];
            if (!files.length) { console.log('::warning::no packaged rezfilter parity evidence'); process.exit(0); }
            for (const file of files) {
              const e = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const attempts = e.twoInsertAttempts || [];
              console.log('::notice title=RezFilter parity identities::'+JSON.stringify({file, identities:e.identities, plugin:e.plugin}));
              for (const a of attempts) {
                const traces = a.first32 || {};
                const summary = Object.fromEntries(Object.entries(traces).map(([slot, t]) => [slot, {
                  sessionId: t.sessionId, classId: t.classId, mode: t.mode, sr: t.sampleRate,
                  in: t.inputEnergy, out: t.outputEnergy, buf: t.bufferEnergy, flags: t.flaggedSilence,
                  life: t.lifecycle, b0: (t.blocks||[])[0], b1: (t.blocks||[])[1]
                }]));
                console.log('::notice title='+file+' attempt '+a.attempt+'::'+JSON.stringify({status:a.status, order:a.order, pcm:a.nativeServicePcm, traces:summary, error:a.error&&String(a.error).slice(0,400)}));
              }
            }
          "

      - name: Upload measured production VST3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-packaged-vst3-evidence
          path: build/native-evidence
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-windows
          path: dist-electron
