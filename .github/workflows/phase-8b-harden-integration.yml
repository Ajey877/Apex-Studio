name: Phase 8B harden playlist history
on:
  push:
    branches:
      - phase-8b-playlist-history
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8b-playlist-history
          fetch-depth: 1
      - name: Harden integration
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          old = "import { applyPlaylistDocument, createPlaylistDocument, createPlaylistHistory, type PlaylistHistory } from './state/playlistHistory';"
          new = "import { createPlaylistHistory, type PlaylistHistory } from './state/playlistHistory';"
          assert text.count(old) == 1, 'Unused history import anchor mismatch'
          text = text.replace(old, new)

          old = '''    const audioBufferId = getRecordingAudioBufferId(recording.id);\n    const loaded = await audioEngine.loadAudioFile(recording.audioBlob, audioBufferId);\n    const persistedRecording: AudioRecording = { ...recording, audioBufferId };\n    // AudioEngine has no buffer-removal API; a removed target leaves only this narrow in-memory orphan.\n    setProjectState(prev => ({\n      ...prev,\n      ...(prev.playlistTracks.some(track => track.id === targetTrackId) ? {\n        recordings: [...prev.recordings, persistedRecording],\n        playlistClips: [...prev.playlistClips, createRecordingPlaylistClip(\n          persistedRecording,\n          { id: audioBufferId, buffer: loaded.buffer, peaks: loaded.peaks, duration: loaded.duration },\n          prev.playlistTracks,\n          prev.playlistTracks.findIndex(track => track.id === targetTrackId),\n          prev.meta.bpm,\n          `rec-clip-${Date.now()}`\n        )],\n        meta: { ...prev.meta, updated: Date.now() }\n      } : {})\n    }));'''
          new = '''    const audioBufferId = getRecordingAudioBufferId(recording.id);\n    const loaded = await audioEngine.loadAudioFile(recording.audioBlob, audioBufferId);\n    const persistedRecording: AudioRecording = { ...recording, audioBufferId };\n    // AudioEngine has no buffer-removal API; a removed target leaves only this narrow in-memory orphan.\n    const currentState = projectStateRef.current;\n    if (!currentState.playlistTracks.some(track => track.id === targetTrackId)) return;\n    const targetTrackIndex = currentState.playlistTracks.findIndex(track => track.id === targetTrackId);\n    const recordingClip = createRecordingPlaylistClip(\n      persistedRecording,\n      { id: audioBufferId, buffer: loaded.buffer, peaks: loaded.peaks, duration: loaded.duration },\n      currentState.playlistTracks,\n      targetTrackIndex,\n      currentState.meta.bpm,\n      `rec-clip-${Date.now()}`\n    );\n    const nextState = {\n      ...currentState,\n      recordings: [...currentState.recordings, persistedRecording],\n      playlistClips: [...currentState.playlistClips, recordingClip],\n      meta: { ...currentState.meta, updated: Date.now() }\n    };\n    updatePlaylistProjectState(nextState);\n    commitPlaylistHistory(nextState, 'Record audio to playlist');'''
          assert text.count(old) == 1, 'Recording playlist block mismatch'
          text = text.replace(old, new)

          old = "      <TakeCompingModal isOpen={isTakeCompingOpen} onClose={() => setIsTakeCompingOpen(false)} onPromoteCompToPlaylist={(newClip) => setProjectState(prev => ({ ...prev, playlistClips: [...prev.playlistClips, newClip] }))} />"
          new = "      <TakeCompingModal isOpen={isTakeCompingOpen} onClose={() => setIsTakeCompingOpen(false)} onPromoteCompToPlaylist={(newClip) => { const nextState = { ...projectStateRef.current, playlistClips: [...projectStateRef.current.playlistClips, newClip] }; updatePlaylistProjectState(nextState); commitPlaylistHistory(nextState, 'Promote comp to playlist'); }} />"
          assert text.count(old) == 1, 'Take comping playlist anchor mismatch'
          text = text.replace(old, new)

          old = "      <WarpAudioProcessorModal isOpen={isWarpProcessorOpen} onClose={() => setIsWarpProcessorOpen(false)} selectedClip={projectState.playlistClips[0] || null} onUpdateClip={(updatedClip) => setProjectState(prev => ({ ...prev, playlistClips: prev.playlistClips.map(c => c.id === updatedClip.id ? updatedClip : c) }))} />"
          new = "      <WarpAudioProcessorModal isOpen={isWarpProcessorOpen} onClose={() => setIsWarpProcessorOpen(false)} selectedClip={projectState.playlistClips[0] || null} onUpdateClip={(updatedClip) => { const nextState = { ...projectStateRef.current, playlistClips: projectStateRef.current.playlistClips.map(c => c.id === updatedClip.id ? updatedClip : c) }; updatePlaylistProjectState(nextState); commitPlaylistHistory(nextState, 'Warp audio clip'); }} />"
          assert text.count(old) == 1, 'Warp playlist anchor mismatch'
          text = text.replace(old, new)

          old = "      <StemSplitterAiModal isOpen={isStemSplitterOpen} onClose={() => setIsStemSplitterOpen(false)} onImportStemsToTracks={(stems) => { const newTracks = stems.map((s, idx) => ({ id: projectState.playlistTracks.length + idx + 1, name: s.name, color: s.type === 'vocals' ? '#ff6e00' : s.type === 'drums' ? '#00ff88' : s.type === 'bass' ? '#00e5ff' : '#a855f7', volume: 0.9, pan: 0, mute: false, solo: false, height: 'normal' as const })); const newClips = stems.map((s, idx) => ({ id: `stem-clip-${Date.now()}-${idx}`, trackIndex: projectState.playlistTracks.length + idx, startBar: 0, lengthBars: 8, type: 'audio' as const, audioBufferId: `stem-${s.type}`, audioName: s.name, color: s.type === 'vocals' ? '#ff6e00' : s.type === 'drums' ? '#00ff88' : s.type === 'bass' ? '#00e5ff' : '#a855f7', name: s.name })); setProjectState(prev => ({ ...prev, playlistTracks: [...prev.playlistTracks, ...newTracks], playlistClips: [...prev.playlistClips, ...newClips] })); }} />"
          new = "      <StemSplitterAiModal isOpen={isStemSplitterOpen} onClose={() => setIsStemSplitterOpen(false)} onImportStemsToTracks={(stems) => { const base = projectStateRef.current; const newTracks = stems.map((s, idx) => ({ id: base.playlistTracks.length + idx + 1, name: s.name, color: s.type === 'vocals' ? '#ff6e00' : s.type === 'drums' ? '#00ff88' : s.type === 'bass' ? '#00e5ff' : '#a855f7', volume: 0.9, pan: 0, mute: false, solo: false, height: 'normal' as const })); const newClips = stems.map((s, idx) => ({ id: `stem-clip-${Date.now()}-${idx}`, trackIndex: base.playlistTracks.length + idx, startBar: 0, lengthBars: 8, type: 'audio' as const, audioBufferId: `stem-${s.type}`, audioName: s.name, color: s.type === 'vocals' ? '#ff6e00' : s.type === 'drums' ? '#00ff88' : s.type === 'bass' ? '#00e5ff' : '#a855f7', name: s.name })); const nextState = { ...base, playlistTracks: [...base.playlistTracks, ...newTracks], playlistClips: [...base.playlistClips, ...newClips] }; updatePlaylistProjectState(nextState); commitPlaylistHistory(nextState, 'Import stems to playlist'); }} />"
          assert text.count(old) == 1, 'Stem splitter playlist anchor mismatch'
          text = text.replace(old, new)

          app.write_text(text)
          print('Playlist history hardening patch applied.')
      - name: Verify
        run: |
          git diff --check
          ! grep -q "applyPlaylistDocument, createPlaylistDocument" src/App.tsx
          grep -q "Record audio to playlist" src/App.tsx
          grep -q "Promote comp to playlist" src/App.tsx
      - name: Commit and remove runner
        run: |
          rm -f .github/workflows/phase-8b-harden-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/phase-8b-harden-integration.yml
          git commit -m "Phase 8B: harden playlist history integration"
          git push origin HEAD:phase-8b-playlist-history
