name: Phase 3 Scheduler Patch

on:
  push:
    branches:
      - fix/phase-3-audio-clock-scheduler

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply scheduler integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/audio/audioEngine.ts')
          text = path.read_text(encoding='utf-8')

          old_import = "} from '../types/daw';\n\nclass AudioEngine {"
          new_import = "} from '../types/daw';\nimport { AudioClockTransport } from './transport';\n\nclass AudioEngine {"
          if old_import not in text:
              raise SystemExit('audioEngine import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_fields = "  private ctx: AudioContext | null = null;\n  private masterGain: GainNode | null = null;"
          new_fields = "  private ctx: AudioContext | null = null;\n  private transport: AudioClockTransport | null = null;\n  private playbackGeneration = 0;\n  private masterGain: GainNode | null = null;"
          if old_fields not in text:
              raise SystemExit('audioEngine field anchor not found')
          text = text.replace(old_fields, new_fields, 1)

          old_init = "    for (let i = 0; i <= 8; i++) {\n      this.getOrCreateMixerChannel(i);\n    }\n\n    // Init Web MIDI"
          new_init = "    for (let i = 0; i <= 8; i++) {\n      this.getOrCreateMixerChannel(i);\n    }\n\n    this.transport = new AudioClockTransport(this.ctx);\n\n    // Init Web MIDI"
          if old_init not in text:
              raise SystemExit('audioEngine init anchor not found')
          text = text.replace(old_init, new_init, 1)

          old_play = '''  public play(\n    channels: Channel[],\n    clips: PlaylistClip[],\n    mode: 'pat' | 'song',\n    patternId?: string\n  ) {\n    if (!this.ctx) this.init();\n    if (this.ctx && this.ctx.state === 'suspended') {\n      this.ctx.resume();\n    }\n\n    this.stop();\n    this.isPlaying = true;\n    this.activeChannels = channels;\n    this.activeClips = clips;\n    this.activePlayMode = mode;\n    this.activePatternId = patternId;\n\n    const scheduleInterval = () => {\n      if (!this.isPlaying) return;\n\n      const secondsPerBeat = 60 / this.bpm;\n      const secondsPerStep = secondsPerBeat / 4;\n      const msPerStep = secondsPerStep * 1000;\n\n      // Apply swing to odd steps (1, 3, 5, 7...)\n      const swingOffset = (this.currentStep % 2 === 1) ? (this.swing / 100) * (msPerStep * 0.4) : 0;\n      const nextDelay = Math.max(15, msPerStep + (this.currentStep % 2 === 1 ? swingOffset : -swingOffset));\n\n      this.triggerCurrentStep();\n\n      // Advance step\n      const nextStep = (this.currentStep + 1) % 16;\n      if (nextStep === 0) {\n        this.currentBar = this.activePlayMode === 'song' ? (this.currentBar % 16) + 1 : 1;\n      }\n      this.currentStep = nextStep;\n\n      if (this.stepCallback) {\n        this.stepCallback(this.currentStep, this.currentBar);\n      }\n\n      this.timerId = setTimeout(scheduleInterval, nextDelay);\n    };\n\n    scheduleInterval();\n  }'''
          new_play = '''  public play(\n    channels: Channel[],\n    clips: PlaylistClip[],\n    mode: 'pat' | 'song',\n    patternId?: string\n  ) {\n    if (!this.ctx) this.init();\n    if (this.ctx && this.ctx.state === 'suspended') {\n      void this.ctx.resume();\n    }\n\n    this.stop();\n    this.playbackGeneration++;\n    const currentGeneration = this.playbackGeneration;\n\n    this.isPlaying = true;\n    this.activeChannels = channels;\n    this.activeClips = clips;\n    this.activePlayMode = mode;\n    this.activePatternId = patternId;\n\n    if (!this.transport && this.ctx) {\n      this.transport = new AudioClockTransport(this.ctx);\n    }\n    if (!this.transport) return;\n\n    this.transport.setBpm(this.bpm);\n    this.transport.setMode(mode);\n    this.transport.setCallbacks({\n      onStep: (step, bar, audioTime) => {\n        if (!this.isPlaying || this.playbackGeneration !== currentGeneration) return;\n\n        this.currentStep = step;\n        this.currentBar = bar;\n\n        const secondsPerBeat = 60 / this.bpm;\n        const secondsPerStep = secondsPerBeat / 4;\n        const swingOffsetSeconds = step % 2 === 1\n          ? (this.swing / 100) * (secondsPerStep * 0.4)\n          : 0;\n\n        this.triggerCurrentStep(audioTime + swingOffsetSeconds);\n\n        if (this.stepCallback) {\n          this.stepCallback(step, bar);\n        }\n      }\n    });\n\n    this.transport.start();\n  }'''
          if old_play not in text:
              raise SystemExit('legacy scheduler block not found')
          text = text.replace(old_play, new_play, 1)

          old_stop = ''' public stop() {\n  this.isPlaying = false;\n\n  if (this.timerId) {\n    clearTimeout(this.timerId);\n    this.timerId = null;\n  }'''
          new_stop = ''' public stop() {\n  this.isPlaying = false;\n  this.playbackGeneration++;\n\n  if (this.timerId) {\n    clearTimeout(this.timerId);\n    this.timerId = null;\n  }\n\n  if (this.transport) {\n    this.transport.stop();\n  }'''
          if old_stop not in text:
              raise SystemExit('legacy stop block not found')
          text = text.replace(old_stop, new_stop, 1)

          old_trigger = "  private triggerCurrentStep() {\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;"
          new_trigger = "  private triggerCurrentStep(audioTime?: number) {\n    if (!this.ctx) return;\n    const now = audioTime ?? this.ctx.currentTime;"
          if old_trigger not in text:
              raise SystemExit('triggerCurrentStep anchor not found')
          text = text.replace(old_trigger, new_trigger, 1)

          path.write_text(text, encoding='utf-8')

          test = Path('src/audio/audioEngine.scheduler.test.ts')
          test.write_text('''import { describe, it } from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\ndescribe('AudioEngine look-ahead scheduler integration', () => {\n  it('uses AudioClockTransport and no longer contains the recursive legacy scheduler', () => {\n    const source = readFileSync(new URL('./audioEngine.ts', import.meta.url), 'utf8');\n    assert.match(source, /AudioClockTransport/);\n    assert.match(source, /this\\.transport\\.start\\(\\)/);\n    assert.match(source, /this\\.transport\\.stop\\(\\)/);\n    assert.match(source, /playbackGeneration/);\n    assert.doesNotMatch(source, /const scheduleInterval = \(\) =>/);\n    assert.doesNotMatch(source, /setTimeout\\(scheduleInterval/);\n  });\n\n  it('schedules step audio using the transport-provided audio time', () => {\n    const source = readFileSync(new URL('./audioEngine.ts', import.meta.url), 'utf8');\n    assert.match(source, /triggerCurrentStep\\(audioTime \\+ swingOffsetSeconds\\)/);\n    assert.match(source, /const now = audioTime \\?\\? this\\.ctx\\.currentTime/);\n  });\n});\n''', encoding='utf-8')
          PY

      - name: Commit scheduler integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/audioEngine.ts src/audio/audioEngine.scheduler.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate audio clock lookahead scheduler"
          git push origin HEAD:fix/phase-3-audio-clock-scheduler

      - name: Install dependencies
        run: npm install

      - name: Validate scheduler integration
        run: npx tsx --test src/audio/transport.test.ts src/audio/audioEngine.scheduler.test.ts

      - name: Validate full audio suite
        run: npm run test:audio

      - name: Validate lint
        run: npm run lint

      - name: Validate build
        run: npm run build
