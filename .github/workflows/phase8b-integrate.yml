name: Phase 8B one-shot integration

on:
  push:
    branches: [phase-8b-playlist-history]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Phase 8B: integrate playlist undo and redo') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply Phase 8B source integration
        run: python3 .github/phase8b_integrate.py

      - name: Focused Phase 8B tests
        run: npx tsx --test src/state/projectHistory.test.ts src/state/playlistHistory.test.ts src/components/playlistClipOperations.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit integrated Phase 8B
        run: |
          set -euo pipefail
          rm -f .github/phase8b_integrate.py .github/workflows/phase8b-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlaylistArranger.tsx package.json src/state/playlistHistory.ts src/state/playlistHistory.test.ts .github/phase8b_integrate.py .github/workflows/phase8b-integrate.yml
          git commit -m 'Phase 8B: integrate playlist undo and redo'
          git push origin HEAD:phase-8b-playlist-history
