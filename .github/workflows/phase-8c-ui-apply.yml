name: Phase 8C UI apply

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harden automation point pointer handling and remove runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PlaylistArranger.tsx')
          s = p.read_text()

          anchors = [
              """                                onPointerMove={(e) => {\n                                  if (interaction?.kind === 'automation-point' && e.pointerId === interaction.pointerId) {\n""",
              """                                onPointerUp={(e) => {\n                                  if (interaction?.kind === 'automation-point' && e.pointerId === interaction.pointerId) {\n""",
              """                                onPointerCancel={(e) => {\n                                  if (interaction?.kind === 'automation-point' && e.pointerId === interaction.pointerId) {\n""",
          ]
          for anchor in anchors:
              if anchor not in s:
                  raise SystemExit('automation pointer handler anchor not found')
              if 'e.stopPropagation();' not in anchor:
                  s = s.replace(anchor, anchor.replace('{\n', '{\n                                    e.stopPropagation();\n', 1), 1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlaylistArranger.tsx
          git rm .github/workflows/phase-8c-ui-apply.yml
          git commit -m 'Phase 8C: isolate automation point pointer events'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
