name: Apex Studio CI

on:
  push:
    branches: [main, phase-0-foundation-ui, phase-5.5-hardening, fix/phase-2-recording-integration-final]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply recording integration patch
        if: github.ref == 'refs/heads/fix/phase-2-recording-integration-final'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          old = '''  const handleSaveRecordingToPlaylist = (recording: AudioRecording, targetTrackIndex: number) => {
    const newClip: PlaylistClip = {
      id: `rec-clip-${Date.now()}`,
      trackIndex: targetTrackIndex,
      startBar: 0,
      lengthBars: Math.max(2, Math.ceil(recording.durationSeconds / 2)),
      type: 'audio',
      audioName: recording.name,
      color: '#ff6e00',
      name: recording.name
    };

    setProjectState(prev => ({
      ...prev,
      playlistClips: [...prev.playlistClips, newClip]
    }));
  };'''
          new = '''  const handleSaveRecordingToPlaylist = async (recording: AudioRecording, targetTrackIndex: number) => {
    if (!recording.audioBlob || recording.audioBlob.size === 0) {
      throw new Error('The recording contains no audio data');
    }

    const audioBufferId = `recording-${recording.id}`;
    const loaded = await audioEngine.loadAudioFile(recording.audioBlob, audioBufferId);
    const secondsPerBar = 240 / Math.max(20, projectState.meta.bpm);
    const lengthBars = Math.max(1, Math.ceil(recording.durationSeconds / secondsPerBar));

    const newClip: PlaylistClip = {
      id: `rec-clip-${Date.now()}`,
      trackIndex: targetTrackIndex,
      startBar: 0,
      lengthBars,
      type: 'audio',
      audioBufferId,
      audioName: recording.name,
      audioWaveform: loaded.peaks,
      color: '#ff6e00',
      name: recording.name
    };

    setProjectState(prev => ({
      ...prev,
      playlistClips: [...prev.playlistClips, newClip]
    }));
  };'''
          if old not in text:
              raise SystemExit('App recording handler anchor not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit recording integration patch
        if: github.ref == 'refs/heads/fix/phase-2-recording-integration-final'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: integrate recorded audio into playlist"
          git push origin HEAD:fix/phase-2-recording-integration-final

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
