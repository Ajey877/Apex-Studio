name: Apex Studio CI

on:
  push:
    branches: [main, phase-0-foundation-ui, phase-5.5-hardening, fix/phase-4-playlist-editing-core, phase-10d-project-persistence-recovery, phase-5-5-song-mode-verification, phase-10e-ci-canonical-branch-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Project state and history tests
        run: npm run test:history

      - name: Persistence and audio tests
        run: npm run test:audio

      - name: Production build
        run: npm run build
