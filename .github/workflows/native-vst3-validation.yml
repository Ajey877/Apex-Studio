name: Native VST3 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, diag/rezfilter-known-onset]

permissions:
  contents: read

jobs:
  native-dsp:
    name: Native DSP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript test tools (no Electron binary needed)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Fetch pinned SDK and build helper plus real test instrument
        run: npm run native:vst3:build
      - name: Verify native DSP and production live/export/state integration
        run: npm run test:native-vst3 && npm run test:vst3-effects && npm run test:vst3-daw
      - name: Annotate RezFilter known-onset evidence
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const p = 'build/native-evidence/rezfilter-known-onset-diag.json';
            if (!fs.existsSync(p)) { console.log('::warning::no rezfilter known-onset evidence'); process.exit(0); }
            const e = JSON.parse(fs.readFileSync(p, 'utf8'));
            const brief = t => t && ({b:t.block,flags:t.silenceFlags,pending:t.pendingWasEmpty,q:t.queuedParameters,inR:t.inputRms,inN:t.inputNonzero,bufR:t.outputBufferRms,bufN:t.outputBufferNonzero,extR:t.extractedRms,extN:t.extractedNonzero});
            console.log('::notice title=RezFilter summary::'+JSON.stringify({sha:e.sha,branch:e.branch,silent:e.packagedMatchSilent}));
            for (const r of e.reports) {
              const payload = r.filter
                ? {n:r.name,d:[r.delay.inputEnergy,r.delay.outputEnergy,r.delay.flaggedSilence],f:[r.filter.inputEnergy,r.filter.outputEnergy,r.filter.flaggedSilence],pending:r.filter.firstPendingWasEmpty,q:r.filter.firstQueued,first:r.filter.first16.slice(0,2).map(brief)}
                : {n:r.name,io:[r.inputEnergy,r.outputEnergy,r.flaggedSilence],pending:r.firstPendingWasEmpty,q:r.firstQueued,first:r.first16.slice(0,2).map(brief)};
              console.log('::notice title='+r.name+'::'+JSON.stringify(payload));
            }
          "
      - name: Install Chromium for real native parameter UI regression
        run: npx playwright install --with-deps chromium
      - name: Native parameter controls through actual App, service, MDA and production export
        run: node scripts/run-native-vst3-browser.mjs
      - name: Upload measured evidence (not a desktop playback claim)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vst3-evidence-${{ matrix.os }}
          path: |
            build/native-evidence
            native/vst3/licenses
          if-no-files-found: warn
