name: Native VST3 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-dsp:
    name: Native DSP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript test tools (no Electron binary needed)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Fetch pinned SDK and build helper plus real test instrument
        run: npm run native:vst3:build
      # Separate steps so a Windows-only failure names the exact suite.
      - name: Native DSP and instrument state integration
        run: npm run test:native-vst3
      - name: Native Mixer effects and latency compensation
        run: npm run test:vst3-effects
      - name: Production live/export/state DAW integration
        run: npm run test:vst3-daw
      - name: Native VST3 editor session and recovery contract
        shell: bash
        run: |
          # Annotate failures: the raw log is not always retrievable, but
          # check-run annotations are, and they name the failing assertion.
          set +e
          npm run test:vst3-editor 2>&1 | tee editor-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "not ok|AssertionError|Error:|error:|Expected|actual|expected" editor-tests.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Prove editor/audio helper process separation with real PIDs
        shell: bash
        timeout-minutes: 6
        run: |
          set +e
          # Stream STAGE markers as notices so a hang is locatable even when the
          # job is cancelled and no log or artifact can be downloaded.
          npm run test:vst3-editor-process 2>&1 | tee separation-tests.log | while IFS= read -r line; do
            echo "$line"
            case "$line" in
              STAGE*) echo "::notice::$line" ;;
              FAIL*|*EVIDENCE\ TIMEOUT*) echo "::error::$line" ;;
            esac
          done
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Verify the AGain VSTGUI editor fixture was built and is discoverable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          node scripts/verify-native-editor-fixture.mjs 2>&1 | tee fixture-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^(PASS|FAIL)|^BUILT|Error:|error:' fixture-tests.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      # Native editor acceptance on a real Windows desktop. The helper is a real
      # process, the window is a real HWND, and AGain attaches its own VSTGUI
      # editor; every criterion is decided from observed Win32 state. The run
      # writes build/native-evidence/native-editor-acceptance.json, which is
      # uploaded below with the rest of the evidence.
      - name: Install Chromium for real native parameter UI regression
        run: npx playwright install --with-deps chromium
      - name: Native parameter controls through actual App, service, MDA and production export
        run: node scripts/run-native-vst3-browser.mjs
      - name: Native VST3 editor acceptance against real Windows HWNDs
        id: editor-acceptance
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set +e
          # An uninteractive runner cannot satisfy every criterion; the script
          # records NOT_VERIFIED for those and exits 3. Only a real FAIL fails
          # the job, and a missing evidence file is always a failure.
          node scripts/native-editor-windows-acceptance.mjs 2>&1 | tee native-editor-acceptance.log
          status=${PIPESTATUS[0]}
          if [ ! -f build/native-evidence/native-editor-acceptance.json ]; then
            echo "::error::The acceptance run produced no evidence file"
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            # FAIL details first: annotations are capped at ~10 per step, so the
            # lines that explain the failure must not be pushed out by stage noise.
            grep -E '^(ACCEPTANCE-ERROR|FAIL-DETAIL|FAIL )' native-editor-acceptance.log | head -8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -E '^STAGE' native-editor-acceptance.log | tail -2 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          # Surface where it stopped and why, even if the log is unreadable.
          # The summary first: it is the only channel that carries every status.
          grep -E '^ACCEPTANCE-SUMMARY' native-editor-acceptance.log | head -1 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          grep -E '^(PASS|NOT_VERIFIED|UNVERIFIED-DETAIL)' native-editor-acceptance.log | head -8 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          exit 0
      - name: Record the acceptance verdict
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The evidence is written and uploaded either way; only a real FAIL (or
          # a missing file) fails the job. NOT_VERIFIED is honest, not a pass.
          if [ "${{ steps.editor-acceptance.outcome }}" = "failure" ]; then
            echo "::error::Native editor acceptance reported a failure; see the artifact"
            exit 1
          fi
          echo "::notice::Native editor acceptance completed; see native-editor-acceptance.json"
      - name: Upload measured evidence (not a desktop playback claim)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vst3-evidence-${{ matrix.os }}
          path: |
            build/native-evidence
            native/vst3/licenses
          if-no-files-found: warn
