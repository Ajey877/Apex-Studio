name: Native VST3 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-dsp:
    name: Native DSP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript test tools (no Electron binary needed)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Fetch pinned SDK and build helper plus real test instrument
        run: npm run native:vst3:build
      # Separate steps so a Windows-only failure names the exact suite.
      - name: Native DSP and instrument state integration
        run: npm run test:native-vst3
      - name: Native Mixer effects and latency compensation
        run: npm run test:vst3-effects
      - name: Production live/export/state DAW integration
        run: npm run test:vst3-daw
      - name: Native VST3 editor session and recovery contract
        shell: bash
        run: |
          # Annotate failures: the raw log is not always retrievable, but
          # check-run annotations are, and they name the failing assertion.
          set +e
          npm run test:vst3-editor 2>&1 | tee editor-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "not ok|AssertionError|Error:|error:|Expected|actual|expected" editor-tests.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Prove editor/audio helper process separation with real PIDs
        shell: bash
        run: |
          set +e
          npm run test:vst3-editor-process 2>&1 | tee separation-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "failed|FAIL|Error|error|check|expected|actual" separation-tests.log | head -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Verify the AGain VSTGUI editor fixture was built and is discoverable
        if: runner.os == 'Windows'
        run: node scripts/verify-native-editor-fixture.mjs
      - name: Install Chromium for real native parameter UI regression
        run: npx playwright install --with-deps chromium
      - name: Native parameter controls through actual App, service, MDA and production export
        run: node scripts/run-native-vst3-browser.mjs
      - name: Upload measured evidence (not a desktop playback claim)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vst3-evidence-${{ matrix.os }}
          path: |
            build/native-evidence
            native/vst3/licenses
          if-no-files-found: warn
