name: Phase 40 temporary diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          npm run lint > phase40-tsc.log 2>&1 || true
          cat phase40-tsc.log
      - name: Upload TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase40-tsc-diagnostics
          path: phase40-tsc.log
