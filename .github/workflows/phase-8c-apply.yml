name: Phase 8C apply

on:
  push:
    branches: [phase-8c-playlist-history-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply Phase 8C hardening
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'src/components/playlistClipOperations.ts',
              "export function deletePlaylistClip(clips: PlaylistClip[], clipId: string): PlaylistClip[] {",
              """export function updatePlaylistAutomationPoint(
            clip: PlaylistClip,
            pointIndex: number,
            newY: number
          ): PlaylistClip {
            if (clip.type !== 'automation' || !clip.automationPoints) {
              throw new Error('Automation point updates require an automation clip with points');
            }
            if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= clip.automationPoints.length) {
              throw new Error('Automation point index is out of range');
            }
            if (!finite(newY)) throw new Error('Automation point value must be finite');

            const updated = cloneClip(clip);
            updated.automationPoints![pointIndex] = {
              ...updated.automationPoints![pointIndex],
              y: Math.max(0, Math.min(1, newY))
            };
            return assertValidPlaylistClip(updated);
          }

          export function deletePlaylistClip(clips: PlaylistClip[], clipId: string): PlaylistClip[] {"""
          )

          replace(
              'src/components/playlistClipOperations.test.ts',
              "  splitPlaylistClip,\n  validatePlaylistClip",
              "  splitPlaylistClip,\n  updatePlaylistAutomationPoint,\n  validatePlaylistClip"
          )
          replace(
              'src/components/playlistClipOperations.test.ts',
              "test('deletePlaylistClip removes only the requested clip', () => {",
              """test('updatePlaylistAutomationPoint clamps values and preserves other point data', () => {
            const clip: PlaylistClip = {
              ...baseClip,
              id: 'automation-1',
              type: 'automation',
              automationPoints: [
                { x: 0, y: 0.25, tension: 0.4 },
                { x: 0.5, y: 0.75, tension: -0.2 }
              ]
            };

            const updated = updatePlaylistAutomationPoint(clip, 1, 2);
            assert.equal(updated.automationPoints?.[1].y, 1);
            assert.equal(updated.automationPoints?.[1].tension, -0.2);
            assert.equal(updated.automationPoints?.[0].y, 0.25);
            assert.notStrictEqual(updated, clip);
          });

          test('updatePlaylistAutomationPoint rejects invalid clips and indexes', () => {
            assert.throws(() => updatePlaylistAutomationPoint(baseClip, 0, 0.5), /automation clip/);
            const clip: PlaylistClip = {
              ...baseClip,
              type: 'automation',
              automationPoints: [{ x: 0, y: 0.5, tension: 0 }]
            };
            assert.throws(() => updatePlaylistAutomationPoint(clip, 2, 0.5), /out of range/);
          });

          test('deletePlaylistClip removes only the requested clip', () => {"""
          )

          replace(
              'src/components/PlaylistArranger.tsx',
              "  splitPlaylistClip,\n} from './playlistClipOperations';",
              "  splitPlaylistClip,\n  updatePlaylistAutomationPoint,\n} from './playlistClipOperations';"
          )
          replace(
              'src/components/PlaylistArranger.tsx',
              """  | { kind: 'resize-right'; clip: PlaylistClip; pointerId: number; originX: number };""",
              """  | { kind: 'resize-right'; clip: PlaylistClip; pointerId: number; originX: number }
  | { kind: 'automation-point'; clip: PlaylistClip; pointerId: number; pointIndex: number; automationTop: number };"""
          )
          replace(
              'src/components/PlaylistArranger.tsx',
              """      } else {
        const requestedEnd = clip.startBar + clip.lengthBars + (clientX - interaction.originX) / BAR_WIDTH;
        const resized = resizePlaylistClipRight(clip, requestedEnd, DEFAULT_GRID_BARS, MIN_CLIP_LENGTH, bounds);
        onUpdateClips(clips.map(item => item.id === clip.id ? resized : item));
      }""",
              """      } else if (interaction.kind === 'resize-right') {
        const requestedEnd = clip.startBar + clip.lengthBars + (clientX - interaction.originX) / BAR_WIDTH;
        const resized = resizePlaylistClipRight(clip, requestedEnd, DEFAULT_GRID_BARS, MIN_CLIP_LENGTH, bounds);
        onUpdateClips(clips.map(item => item.id === clip.id ? resized : item));
      } else {
        const nextY = 1 - ((clientY - interaction.automationTop) / 20);
        const updated = updatePlaylistAutomationPoint(clip, interaction.pointIndex, nextY);
        onUpdateClips(clips.map(item => item.id === clip.id ? updated : item));
      }"""
          )
          replace(
              'src/components/PlaylistArranger.tsx',
              """  const beginInteraction = (event: React.PointerEvent, next: Interaction) => {""",
              """  const beginAutomationPointInteraction = (event: React.PointerEvent<SVGCircleElement>, clip: PlaylistClip, pointIndex: number) => {
    if (activeTool !== 'place' || !clip.automationPoints?.[pointIndex]) return;
    event.preventDefault();
    event.stopPropagation();
    const svg = event.currentTarget.ownerSVGElement;
    if (!svg) return;
    onPlaylistInteractionStart?.('automation-point');
    event.currentTarget.setPointerCapture(event.pointerId);
    setSelectedClipId(clip.id);
    setAutomationEditorClipId(clip.id);
    setInteraction({
      kind: 'automation-point',
      clip,
      pointerId: event.pointerId,
      pointIndex,
      automationTop: svg.getBoundingClientRect().top
    });
  };

  const beginInteraction = (event: React.PointerEvent, next: Interaction) => {"""
          )
          replace(
              'src/components/PlaylistArranger.tsx',
              """                              <circle
                                key={pIdx}
                                cx={p.x * (clip.lengthBars * 96 - 12)}
                                cy={(1 - p.y) * 20}
                                r=\"3\"
                                fill=\"#ffffff\"
                              />""",
              """                              <circle
                                key={pIdx}
                                cx={p.x * (clip.lengthBars * 96 - 12)}
                                cy={(1 - p.y) * 20}
                                r=\"4\"
                                fill=\"#ffffff\"
                                className=\"cursor-ns-resize\"
                                onPointerDown={(e) => beginAutomationPointInteraction(e, clip, pIdx)}
                              />"""
          )

          replace(
              'src/App.tsx',
              "  const playlistInteractionActiveRef = useRef(false);\n  const projectStateRef",
              "  const playlistInteractionActiveRef = useRef(false);\n  const playlistInteractionKindRef = useRef<string | null>(null);\n  const projectStateRef"
          )
          replace(
              'src/App.tsx',
              "    playlistInteractionActiveRef.current = false;\n    setPlaylistHistoryVersion",
              "    playlistInteractionActiveRef.current = false;\n    playlistInteractionKindRef.current = null;\n    setPlaylistHistoryVersion"
          )
          replace(
              'src/App.tsx',
              """  const handlePlaylistInteractionStart = useCallback(() => {
    playlistInteractionActiveRef.current = true;
  }, []);

  const handlePlaylistInteractionEnd = useCallback(() => {
    if (!playlistInteractionActiveRef.current) return;
    playlistInteractionActiveRef.current = false;
    commitPlaylistHistory(projectStateRef.current, 'Playlist interaction');
  }, [commitPlaylistHistory]);""",
              """  const handlePlaylistInteractionStart = useCallback((kind: string) => {
    playlistInteractionActiveRef.current = true;
    playlistInteractionKindRef.current = kind;
  }, []);

  const handlePlaylistInteractionEnd = useCallback(() => {
    if (!playlistInteractionActiveRef.current) return;
    playlistInteractionActiveRef.current = false;
    const kind = playlistInteractionKindRef.current;
    playlistInteractionKindRef.current = null;
    const labels: Record<string, string> = {
      move: 'Move playlist clip',
      'resize-left': 'Resize playlist clip start',
      'resize-right': 'Resize playlist clip end',
      'automation-point': 'Edit automation point'
    };
    commitPlaylistHistory(projectStateRef.current, labels[kind || ''] || 'Playlist interaction');
  }, [commitPlaylistHistory]);"""
          )

          workflow = Path('.github/workflows/phase-8c-apply.yml')
          workflow.unlink()
          print('Phase 8C source changes applied; temporary workflow removed.')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/playlistClipOperations.ts src/components/playlistClipOperations.test.ts src/components/PlaylistArranger.tsx src/App.tsx .github/workflows/phase-8c-apply.yml
          git diff --cached --quiet && exit 0
          git commit -m "Phase 8C: harden playlist interaction history"
          git push
