name: Release Apex Studio DAW (Windows & Multi-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing vX.Y.Z tag to build and publish; empty builds the selected ref without publishing"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Standalone .EXE & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Tag pushes use github.ref; manual release inputs are qualified to refs/tags/.
          # Empty manual input preserves the selected branch/ref build behavior.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag commit
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-tag.mjs

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Desktop security configuration
        run: npm run verify:desktop

      - name: TypeScript check
        run: npm run lint

      - name: Audio regression tests
        run: npm run test:audio

      - name: History regression tests
        run: npm run test:history

      - name: Compile Optimized Web Bundle
        run: npm run build

      - name: Package Standalone Windows Executable (.exe)
        run: npm run package:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: success() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "Apex Studio DAW ${{ inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Apex Studio DAW ${{ inputs.release_tag || github.ref_name }}

            Official Windows release of Apex Studio DAW.

            Automated regression validation covers core audio transport, project persistence/recovery, offline rendering/export, production builds, and packaged Windows startup. These checks do not replace device-specific listening or hardware MIDI acceptance.

            ## Downloads
            Windows installer and portable executable files are attached below as release assets.

            ## Notes
            - Windows x64
            - Electron 43.4.1
            - Unsigned Windows binaries may show the normal Windows SmartScreen warning.
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
