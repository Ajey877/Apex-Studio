name: Release Apex Studio DAW (Windows & Multi-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Standalone .EXE & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Audio regression tests
        run: npm run test:audio

      - name: Compile Optimized Web Bundle
        run: npm run build

      - name: Package Standalone Windows Executable (.exe)
        run: npm run package:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Apex Studio DAW ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: "Official standalone Windows installer (.exe) for Apex Studio DAW."
          files: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
