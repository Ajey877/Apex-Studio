name: P9 High-DPI Editor Acceptance

# Native VST3 editor acceptance at REAL Windows display scales
# (docs/VST3-EDITOR-ACCEPTANCE.md, P9).
#
# The runner's display scale is changed the way the Settings app changes it, so
# Windows itself reports 120/144 DPI and itself sends WM_DPICHANGED. Nothing here
# simulates a DPI value.
#
# The runner has ONE monitor. The `branch` job therefore leaves the multi-monitor
# cases NOT_VERIFIED. The `branch-second-display` job adds a VIRTUAL second display
# (an indirect display driver) so that those cases can run; its evidence is about
# per-monitor DPI handling, not about physical monitor hardware.
#
# Job logs and artifacts are not always retrievable, so every verdict and the
# measurements behind it are also published as check-run annotations.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'native/vst3/**'
      - 'scripts/native-editor-dpi-acceptance.mjs'
      - 'scripts/windows-display-scale.ps1'
      - 'scripts/ci-install-virtual-display.ps1'
      - 'scripts/build-native-vst3.mjs'
      - 'scripts/setup-native-vst3.mjs'
      - '.github/workflows/p9-dpi-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'native/vst3/**'
      - 'scripts/native-editor-dpi-acceptance.mjs'
      - 'scripts/windows-display-scale.ps1'
      - 'scripts/ci-install-virtual-display.ps1'
      - 'scripts/build-native-vst3.mjs'
      - 'scripts/setup-native-vst3.mjs'
      - '.github/workflows/p9-dpi-acceptance.yml'

permissions:
  contents: read

jobs:
  dpi-acceptance:
    name: Editor at real display scale (${{ matrix.host }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: branch
          # The same sources on a desktop with a virtual second display.
          - host: branch-second-display
            second_display: true
          # `baseline` builds the helper exactly as it was on main before the P9
          # fix (c246e2a) and runs the SAME harness against it. It is expected to
          # fail: that failure is the reproduction of the defect, kept as
          # evidence. It is informational and never gates the workflow.
          - host: baseline
            baseline: true
    continue-on-error: ${{ matrix.baseline == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript tools (no Electron binary needed)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Use the pre-fix native helper sources (baseline only)
        if: matrix.baseline
        shell: bash
        run: |
          git checkout c246e2a91f7d7c7aaca1d9903d334e7eceab5be8 -- native/vst3 scripts/build-native-vst3.mjs
          git status --short | head -20
      - name: Display before the run, and a resolution that allows 150%
        shell: pwsh
        run: |
          function Note($title, $text) {
            $t = ([string]$text) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::notice title=$title::$t"
          }
          $tool = './scripts/windows-display-scale.ps1'
          $os = Get-CimInstance Win32_OperatingSystem
          Note 'P9-ENV ${{ matrix.host }}' ("{0} {1} image={2} {3} session={4} interactive={5}" -f $os.Caption, $os.Version, $env:ImageOS, $env:ImageVersion, [System.Diagnostics.Process]::GetCurrentProcess().SessionId, [Environment]::UserInteractive)
          # The runner boots at 1024x768, where Windows offers at most 125%.
          $resolution = & $tool -Action set-resolution -Width 1920 -Height 1080
          Note 'P9-DISPLAY ${{ matrix.host }}' $resolution
          $global:LASTEXITCODE = 0
      - name: Add a virtual second display (pinned third-party driver, this runner only)
        if: matrix.second_display
        shell: pwsh
        run: |
          $json = ./scripts/ci-install-virtual-display.ps1
          $info = $json | ConvertFrom-Json
          $text = ([string]$json) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
          if ($text.Length -gt 3900) { $text = $text.Substring(0, 3900) }
          Write-Host "::notice title=P9-VIRTUAL-DISPLAY ${{ matrix.host }}::$text"
          if (-not $info.available) {
            Write-Host "::warning title=P9-VIRTUAL-DISPLAY::No second display on this runner. The multi-monitor cases will be NOT_VERIFIED in this job."
          }
          $global:LASTEXITCODE = 0
      - name: Build the helper and the AGain VSTGUI editor fixture
        run: npm run native:vst3:build
      - name: P9 acceptance at 100%, 125% and 150% on the real display
        id: acceptance
        shell: bash
        timeout-minutes: 20
        env:
          APEX_P9_ALLOW_DISPLAY_CHANGES: '1'
          APEX_P9_HOST_LABEL: ${{ matrix.host }}
          APEX_P9_OUT: build/native-evidence/p9-${{ matrix.host }}
        run: |
          set +e
          node scripts/native-editor-dpi-acceptance.mjs 2>&1 | tee p9-acceptance.log
          status=${PIPESTATUS[0]}
          echo "harness exit code: $status"
          if [ ! -f "$APEX_P9_OUT/p9-dpi-acceptance.json" ]; then
            echo "::error::The P9 run produced no evidence file"
            grep -E '^(P9-ERROR|STAGE)' p9-acceptance.log | tail -4 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -c 1500 p9-acceptance.log | tr '\n' ' ' | sed 's/^/::error::/'
            exit 1
          fi
          # 0 = every case passed, 3 = no failure but some cases NOT_VERIFIED (the
          # multi-monitor ones always are on this single-monitor runner).
          if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then exit 0; fi
          exit 1
      - name: Upload evidence (JSON and screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-evidence-${{ matrix.host }}
          path: |
            build/native-evidence/p9-${{ matrix.host }}
            p9-acceptance.log
          if-no-files-found: warn

  # Evidence as content-addressed git blobs. Artifacts cannot be fetched from every
  # environment; a blob can, and its SHA is the file's git hash, so a copy checked
  # into docs/evidence can be verified against the SHA printed here. No ref is
  # created or changed. This job runs no plug-in or helper code.
  publish-evidence:
    name: Publish evidence blobs
    needs: dpi-acceptance
    # Never for a pull request from a fork: its token cannot write, and must not.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: p9-evidence-*
      - name: Store each evidence file as a git blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : > manifest.txt
          find evidence -type f \( -name '*.json' -o -name '*.png' -o -name '*.log' \) | sort | while IFS= read -r file; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt 900000 ]; then echo "skip (too large): $file"; continue; fi
            sha=$(base64 -w0 "$file" | jq -Rs '{content: ., encoding: "base64"}' | gh api "repos/$REPO/git/blobs" --input - --jq .sha)
            echo "$sha $size ${file#evidence/}" | tee -a manifest.txt
          done
          manifest=$(base64 -w0 manifest.txt | jq -Rs '{content: ., encoding: "base64"}' | gh api "repos/$REPO/git/blobs" --input - --jq .sha)
          echo "::notice title=P9-EVIDENCE-MANIFEST::manifest blob $manifest ($(wc -l < manifest.txt) files) for commit ${{ github.sha }}"
