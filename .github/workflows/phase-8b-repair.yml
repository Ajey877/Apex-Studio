name: Phase 8B Repair

on:
  push:
    branches:
      - phase-8b-playlist-history

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 8B branch
        uses: actions/checkout@v4
        with:
          ref: phase-8b-playlist-history
          fetch-depth: 1

      - name: Remove duplicate recording target identifier
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = """    const targetTrackIndex = currentState.playlistTracks.findIndex(track => track.id === targetTrackId);\n    const recordingClip = createRecordingPlaylistClip(\n      persistedRecording,\n      { id: audioBufferId, buffer: loaded.buffer, peaks: loaded.peaks, duration: loaded.duration },\n      currentState.playlistTracks,\n      targetTrackIndex,"""
          new = """    const currentTargetTrackIndex = currentState.playlistTracks.findIndex(track => track.id === targetTrackId);\n    const recordingClip = createRecordingPlaylistClip(\n      persistedRecording,\n      { id: audioBufferId, buffer: loaded.buffer, peaks: loaded.peaks, duration: loaded.duration },\n      currentState.playlistTracks,\n      currentTargetTrackIndex,"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one duplicate-target block, found {text.count(old)}')
          path.write_text(text.replace(old, new))

      - name: Remove temporary repair workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/phase-8b-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/phase-8b-repair.yml
          git commit -m "fix: resolve Phase 8B recording target identifier"
          git push origin phase-8b-playlist-history
