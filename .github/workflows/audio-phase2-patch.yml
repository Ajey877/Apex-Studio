name: Audio Phase 2 Patch

on:
  push:
    branches: [phase-0-foundation-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Harden recording engine
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/audio/audioEngine.ts')
          s = p.read_text(encoding='utf-8')

          field = "  private recordingStartTime = 0;"
          if field not in s:
              marker = "  private recordingAnalyser: AnalyserNode | null = null;"
              if marker not in s:
                  raise SystemExit('Recording analyser field not found')
              s = s.replace(marker, marker + "\n" + field, 1)

          start_pattern = re.compile(
              r"  public async startAudioRecording\(\): Promise<MediaStream> \{.*?\n  \}\n\n  public getRecordingPeak",
              re.S,
          )
          start_replacement = '''  public async startAudioRecording(): Promise<MediaStream> {
    if (!this.ctx) this.init();
    const ctx = this.ctx;
    if (!ctx) throw new Error('Audio engine failed to initialize');

    if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
      throw new Error('A recording is already in progress');
    }

    this.recordedChunks = [];
    this.recordingStartTime = 0;

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Microphone capture is not available in this environment');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      }
    });

    try {
      if (typeof MediaRecorder === 'undefined') {
        throw new Error('MediaRecorder is not available in this environment');
      }

      this.mediaStream = stream;
      const source = ctx.createMediaStreamSource(stream);
      this.recordingAnalyser = ctx.createAnalyser();
      this.recordingAnalyser.fftSize = 256;
      this.recordingAnalyser.smoothingTimeConstant = 0.7;
      source.connect(this.recordingAnalyser);

      const preferredMimeTypes = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus'
      ];
      const mimeType = preferredMimeTypes.find(type => MediaRecorder.isTypeSupported(type));
      this.mediaRecorder = mimeType
        ? new MediaRecorder(stream, { mimeType })
        : new MediaRecorder(stream);

      this.mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) this.recordedChunks.push(event.data);
      };
      this.mediaRecorder.onerror = () => {
        this.mediaRecorder = null;
      };
      this.mediaRecorder.start(100);
      this.recordingStartTime = performance.now();

      return stream;
    } catch (error) {
      stream.getTracks().forEach(track => track.stop());
      this.mediaStream = null;
      this.mediaRecorder = null;
      this.recordingAnalyser?.disconnect();
      this.recordingAnalyser = null;
      throw error;
    }
  }

  public getRecordingPeak'''

          s2, count = start_pattern.subn(start_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Unable to locate startAudioRecording implementation')
          s = s2

          stop_pattern = re.compile(
              r"  public async stopAudioRecording\(\): Promise<AudioRecording> \{.*?\n  \}\n\n  // Web MIDI API Integration",
              re.S,
          )
          stop_replacement = '''  public async stopAudioRecording(): Promise<AudioRecording> {
    const recorder = this.mediaRecorder;
    const startedAt = this.recordingStartTime;

    if (!recorder) {
      return {
        id: `rec-${Date.now()}`,
        name: 'Empty Take',
        timestamp: Date.now(),
        durationSeconds: 0,
        waveform: []
      };
    }

    return new Promise((resolve, reject) => {
      let settled = false;
      const fail = (error: unknown) => {
        if (settled) return;
        settled = true;
        reject(error instanceof Error ? error : new Error('Unable to finalize recording'));
      };

      recorder.onerror = () => fail(new Error('Audio recording failed'));
      recorder.onstop = async () => {
        try {
          const blob = new Blob(this.recordedChunks, {
            type: recorder.mimeType || 'audio/webm'
          });
          const url = URL.createObjectURL(blob);
          const durationSeconds = startedAt > 0
            ? Math.max(0, (performance.now() - startedAt) / 1000)
            : 0;

          if (this.mediaStream) {
            this.mediaStream.getTracks().forEach(track => track.stop());
            this.mediaStream = null;
          }
          if (this.recordingAnalyser) {
            this.recordingAnalyser.disconnect();
            this.recordingAnalyser = null;
          }
          this.mediaRecorder = null;
          this.recordingStartTime = 0;

          let waveform: number[] = [];
          try {
            if (blob.size > 0) {
              const audioBuffer = await this.getContext().decodeAudioData(await blob.arrayBuffer());
              const data = audioBuffer.getChannelData(0);
              const buckets = 64;
              const block = Math.max(1, Math.floor(data.length / buckets));
              waveform = Array.from({ length: buckets }, (_, bucket) => {
                let peak = 0;
                const begin = bucket * block;
                const end = Math.min(data.length, begin + block);
                for (let i = begin; i < end; i++) peak = Math.max(peak, Math.abs(data[i]));
                return Number(peak.toFixed(4));
              });
            }
          } catch {
            waveform = [];
          }

          if (settled) return;
          settled = true;
          resolve({
            id: `rec-${Date.now()}`,
            name: `Vocal Take ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`,
            timestamp: Date.now(),
            durationSeconds,
            audioBlob: blob,
            audioUrl: url,
            waveform
          });
        } catch (error) {
          fail(error);
        }
      };

      if (recorder.state === 'recording' || recorder.state === 'paused') {
        try {
          recorder.stop();
        } catch (error) {
          fail(error);
        }
      } else {
        // The recorder may already be inactive after an unexpected browser event.
        void recorder.onstop?.(new Event('stop'));
      }
    });
  }

  // Web MIDI API Integration'''

          s2, count = stop_pattern.subn(stop_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Unable to locate stopAudioRecording implementation')
          s = s2

          p.write_text(s, encoding='utf-8')

      - name: Verify source
        run: |
          npm install --legacy-peer-deps
          npm run lint
          npm run build

      - name: Commit hardened recording engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/audio/audioEngine.ts
          if git diff --cached --quiet; then
            echo 'Recording engine already hardened; nothing to commit.'
          else
            git commit -m 'fix: harden audio recording lifecycle and waveform generation'
            git push
          fi

      - name: Remove patch workflow
        run: |
          rm -f .github/workflows/audio-phase2-patch.yml
          git add .github/workflows/audio-phase2-patch.yml
          if git diff --cached --quiet; then
            echo 'Patch workflow already removed.'
          else
            git commit -m 'chore: remove one-shot phase 2 patch workflow'
            git push
          fi
