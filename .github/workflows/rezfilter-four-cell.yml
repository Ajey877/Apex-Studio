name: RezFilter four-cell packaged comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: candidate
            ref: diag/packaged-rezfilter-parity
          - id: main
            ref: diag/packaged-rezfilter-parity-main
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run native:vst3:build
      - name: Package Windows dir without a second native rebuild
        run: node scripts/stage-vst3-helper.mjs && npx vite build && npx electron-builder --win --x64 --dir --publish never
      - name: Record frozen application/helper hashes
        shell: bash
        run: |
          mkdir -p build/native-evidence
          node scripts/hash-frozen-binaries.mjs build/native-evidence/frozen-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-app-${{ matrix.id }}
          path: dist-electron/win-unpacked
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-manifest-${{ matrix.id }}
          path: build/native-evidence/frozen-manifest.json
          if-no-files-found: error

  build-plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: candidate
            ref: diag/packaged-rezfilter-parity
            trace: '0'
          - id: main
            ref: diag/packaged-rezfilter-parity-main
            trace: '0'
          - id: instrumented
            ref: diag/packaged-rezfilter-parity
            trace: '1'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Build plugin only
        env:
          APEX_MDA_REZFILTER_TRACE: ${{ matrix.trace }}
        run: npm run native:vst3:build
      - name: Hash plugin module
        shell: bash
        run: |
          mkdir -p build/native-evidence
          node scripts/hash-frozen-binaries.mjs build/native-evidence/plugin-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: mda-vst3-${{ matrix.id }}
          path: build/native-vst3/VST3/Release/mda-vst3.vst3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-manifest-${{ matrix.id }}
          path: build/native-evidence/plugin-manifest.json

  packaged-cell:
    needs: [package-app, build-plugin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: candidate
            plugin: candidate
            phase: attempts
          - app: candidate
            plugin: main
            phase: attempts
          - app: main
            plugin: candidate
            phase: attempts
          - app: main
            plugin: main
            phase: attempts
          - app: candidate
            plugin: instrumented
            phase: attempts
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout matching application smoke scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.app == 'main' && 'diag/packaged-rezfilter-parity-main' || 'diag/packaged-rezfilter-parity' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download frozen application
        uses: actions/download-artifact@v4
        with:
          name: frozen-app-${{ matrix.app }}
          path: dist-electron/win-unpacked

      - name: Download frozen app manifest
        uses: actions/download-artifact@v4
        with:
          name: frozen-manifest-${{ matrix.app }}
          path: frozen-app-manifest

      - name: Download swapped plugin
        uses: actions/download-artifact@v4
        with:
          name: mda-vst3-${{ matrix.plugin }}
          path: swapped-plugin

      - name: Download plugin manifest
        uses: actions/download-artifact@v4
        with:
          name: plugin-manifest-${{ matrix.plugin }}
          path: frozen-plugin-manifest

      - name: Install frozen plugin and verify helper identity
        shell: bash
        env:
          CELL: ${{ matrix.app }}-app-${{ matrix.plugin }}-plugin
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            function rm(p) { fs.rmSync(p, { recursive: true, force: true }); }
            function copy(src, dest) {
              const st = fs.statSync(src);
              if (st.isDirectory()) {
                fs.mkdirSync(dest, { recursive: true });
                for (const name of fs.readdirSync(src)) copy(path.join(src, name), path.join(dest, name));
              } else {
                fs.mkdirSync(path.dirname(dest), { recursive: true });
                fs.copyFileSync(src, dest);
              }
            }
            function find(bundle) {
              if (!bundle || !fs.existsSync(bundle)) return null;
              if (fs.statSync(bundle).isFile()) return bundle;
              const stack = [bundle];
              let best = null, bestSize = -1;
              while (stack.length) {
                const dir = stack.pop();
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) stack.push(full);
                  else if (/\.(vst3|dll|so|dylib)$/i.test(entry.name)) {
                    const size = fs.statSync(full).size;
                    if (size > bestSize) { best = full; bestSize = size; }
                  }
                }
              }
              return best;
            }
            function sha(file) { return crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex"); }
            const dest = "build/native-vst3/VST3/Release/mda-vst3.vst3";
            const srcRoot = "swapped-plugin";
            const nested = path.join(srcRoot, "mda-vst3.vst3");
            rm(dest);
            copy(fs.existsSync(nested) ? nested : srcRoot, dest);
            const pluginMod = find(dest);
            const pluginSha = sha(pluginMod);
            const pluginManifest = JSON.parse(fs.readFileSync("frozen-plugin-manifest/plugin-manifest.json", "utf8"));
            const appManifest = JSON.parse(fs.readFileSync("frozen-app-manifest/frozen-manifest.json", "utf8"));
            const helper = "dist-electron/win-unpacked/resources/vst3/apex-vst3-host.exe";
            if (!fs.existsSync(helper)) { console.error("frozen helper missing"); process.exit(1); }
            const helperSha = sha(helper);
            const report = {
              cell: process.env.CELL, pluginModule: pluginMod, pluginSha, expectedPluginSha: pluginManifest.pluginModuleSha256,
              pluginMatch: pluginSha === pluginManifest.pluginModuleSha256,
              helperSha, expectedHelperSha: appManifest.helperSha256,
              helperMatch: helperSha === appManifest.helperSha256,
              appExeSha: appManifest.applicationExecutableSha256,
            };
            console.log("::notice title=frozen identities " + process.env.CELL + "::" + JSON.stringify(report));
            if (!report.pluginMatch || !report.helperMatch) {
              console.log("::error title=frozen identity mismatch::" + JSON.stringify(report));
              process.exit(1);
            }
          '

      - name: Run packaged Windows runtime smoke test
        env:
          APEX_REZFILTER_PHASE: ${{ matrix.phase }}
          APEX_REZFILTER_TRACE: ${{ matrix.plugin == 'instrumented' && 'build/native-evidence/rezfilter-internal.bin' || '' }}
        run: node scripts/desktop-smoke.mjs

      - name: Annotate four-cell evidence
        if: always()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const cell = 'app=${{ matrix.app }} plugin=${{ matrix.plugin }}';
            const dir = 'build/native-evidence';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir) : [];
            console.log('::notice title='+cell+' files::'+JSON.stringify(files));
            const independent = files.filter(f => f.includes('independent-phases'));
            for (const file of independent) {
              console.log('::notice title='+cell+' independent::'+fs.readFileSync(path.join(dir, file), 'utf8').slice(0, 3900));
            }
            const parity = files.filter(f => f.includes('rezfilter-parity'));
            for (const file of parity) {
              const e = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const summary = e.summary || e.rezFilterParity?.summary;
              const identities = e.identities || e.rezFilterParity?.identities;
              console.log('::notice title='+cell+' summary::'+JSON.stringify({ summary, identities, independent: e.independent, stallError: e.stallError, pcmCorpus: e.pcmCorpus, stateFingerprints: e.stateFingerprints }).slice(0, 3900));
            }
            const corpus = files.find(f => f.includes('pcm-corpus')) || (fs.existsSync(path.join(dir, fs.readdirSync(dir).find(n => n.includes('pcm-corpus')) || '')) ? 'pcm' : null);
          "
          if [ -f build/native-evidence/rezfilter-internal.bin.json ]; then node scripts/decode-rezfilter-trace.mjs build/native-evidence/rezfilter-internal.bin.json; fi

      - name: Upload four-cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-cell-${{ matrix.app }}-app-${{ matrix.plugin }}-plugin
          path: build/native-evidence
          if-no-files-found: warn
