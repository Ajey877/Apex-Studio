name: Stabilize FX Chain

on:
  push:
    branches: [phase-0-foundation-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0-foundation-ui
          fetch-depth: 0

      - name: Fix chained FX routing
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/audio/audioEngine.ts')
          text = path.read_text()
          old = """      if (fxNode) {\n        currentSource.connect(fxNode);\n        currentSource = fxNode;\n        channel.fxNodes.push(fxNode);\n      }"""
          new = """      if (fxNode) {\n        currentSource.connect(fxNode);\n        const chainEnd = (fxNode as AudioNode & { _chainEnd?: AudioNode })._chainEnd ?? fxNode;\n        currentSource = chainEnd;\n        channel.fxNodes.push(fxNode);\n        if (chainEnd !== fxNode) channel.fxNodes.push(chainEnd);\n      }"""
          if old not in text:
              print('FX chain already stabilized or source changed; no edit needed.')
          else:
              path.write_text(text.replace(old, new, 1))

      - name: Commit fix if changed
        shell: bash
        run: |
          if git diff --quiet -- src/audio/audioEngine.ts; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/audioEngine.ts
          git commit -m "fix: complete chained mixer FX routing"
          git push origin phase-0-foundation-ui
