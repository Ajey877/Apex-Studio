name: Finalize Phase 8B

on:
  push:
    branches: [phase-8b-playlist-history]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Phase 8B: integrate playlist undo and redo') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply Phase 8B PlaylistArranger integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:src/components/PlaylistArranger.tsx > /tmp/PlaylistArranger.tsx
          python <<'PY'
          from pathlib import Path

          path = Path('/tmp/PlaylistArranger.tsx')
          s = path.read_text()

          def replace_once(text: str, old: str, new: str, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected 1 match, found {count}')
              return text.replace(old, new)

          s = replace_once(s, "import React, { useState, useRef } from 'react';", "import React, { useEffect, useState, useRef } from 'react';", 'react import')
          s = replace_once(s, "import { audioEngine } from '../audio/audioEngine';", "import { audioEngine } from '../audio/audioEngine';\nimport { DEFAULT_PROJECT } from '../audio/presets';\nimport { createPlaylistDocument, createPlaylistHistory, type PlaylistDocument, type PlaylistHistory } from '../state/playlistHistory';", 'history imports')
          s = replace_once(s, "  onUpdateTracks,\n  onUpdateClips,\n  onUpdateMarkers,\n  onAddTrack,", "  onUpdateTracks: onUpdateTracksProp,\n  onUpdateClips: onUpdateClipsProp,\n  onUpdateMarkers: onUpdateMarkersProp,\n  onAddTrack: onAddTrackProp,", 'callback aliases')
          s = replace_once(s, "  const bounds = { totalBars, maxTracks: tracks.length };", """  const bounds = { totalBars, maxTracks: tracks.length };

  const makeHistoryState = (document: PlaylistDocument) => ({
    ...structuredClone(DEFAULT_PROJECT),
    playlistTracks: structuredClone(document.playlistTracks),
    playlistClips: structuredClone(document.playlistClips),
    markers: structuredClone(document.markers)
  });

  const currentPlaylistDocument = () => createPlaylistDocument(tracks, clips, markers);
  const [playlistHistory, setPlaylistHistory] = useState<PlaylistHistory>(() =>
    createPlaylistHistory(makeHistoryState(currentPlaylistDocument()))
  );
  const interactionStartDocumentRef = useRef<PlaylistDocument | null>(null);
  const interactionPreviewDocumentRef = useRef<PlaylistDocument | null>(null);

  const commitPlaylistEdit = (document: PlaylistDocument, label: string) => {
    setPlaylistHistory(previous => previous.commit(makeHistoryState(document), label));
  };

  const onUpdateTracks = (nextTracks: PlaylistTrack[]) => {
    const document = createPlaylistDocument(nextTracks, latestDocumentRef.current.playlistClips, latestDocumentRef.current.markers);
    latestDocumentRef.current = document;
    onUpdateTracksProp(nextTracks);
    if (interactionStartDocumentRef.current) {
      interactionPreviewDocumentRef.current = document;
    } else {
      commitPlaylistEdit(document, 'Edit Playlist Track');
    }
  };

  const onUpdateClips = (nextClips: PlaylistClip[]) => {
    const document = createPlaylistDocument(latestDocumentRef.current.playlistTracks, nextClips, latestDocumentRef.current.markers);
    latestDocumentRef.current = document;
    onUpdateClipsProp(nextClips);
    if (interactionStartDocumentRef.current) {
      interactionPreviewDocumentRef.current = document;
    } else {
      commitPlaylistEdit(document, 'Edit Playlist Clip');
    }
  };

  const onUpdateMarkers = (nextMarkers: ArrangementMarker[]) => {
    const document = createPlaylistDocument(latestDocumentRef.current.playlistTracks, latestDocumentRef.current.playlistClips, nextMarkers);
    latestDocumentRef.current = document;
    onUpdateMarkersProp?.(nextMarkers);
    if (interactionStartDocumentRef.current) {
      interactionPreviewDocumentRef.current = document;
    } else {
      commitPlaylistEdit(document, 'Edit Arrangement Marker');
    }
  };

  const onAddTrack = () => {
    const nextId = tracks.length + 1;
    const nextTrack: PlaylistTrack = {
      id: nextId,
      name: `Track ${nextId}`,
      color: '#ff6e00',
      volume: 0.9,
      pan: 0,
      mute: false,
      solo: false
    };
    onAddTrackProp();
    commitPlaylistEdit(createPlaylistDocument([...tracks, nextTrack], latestDocumentRef.current.playlistClips, latestDocumentRef.current.markers), 'Add Playlist Track');
  };

  const latestDocumentRef = useRef<PlaylistDocument>(currentPlaylistDocument());

  const undoPlaylistEdit = () => {
    const result = playlistHistory.undo(makeHistoryState(latestDocumentRef.current));
    if (result.history === playlistHistory) return;
    setPlaylistHistory(result.history);
    const document = createPlaylistDocument(result.state.playlistTracks, result.state.playlistClips, result.state.markers || []);
    latestDocumentRef.current = document;
    onUpdateTracksProp(document.playlistTracks);
    onUpdateClipsProp(document.playlistClips);
    onUpdateMarkersProp?.(document.markers);
  };

  const redoPlaylistEdit = () => {
    const result = playlistHistory.redo(makeHistoryState(latestDocumentRef.current));
    if (result.history === playlistHistory) return;
    setPlaylistHistory(result.history);
    const document = createPlaylistDocument(result.state.playlistTracks, result.state.playlistClips, result.state.markers || []);
    latestDocumentRef.current = document;
    onUpdateTracksProp(document.playlistTracks);
    onUpdateClipsProp(document.playlistClips);
    onUpdateMarkersProp?.(document.markers);
  };

  useEffect(() => {
    const incoming = currentPlaylistDocument();
    latestDocumentRef.current = incoming;
    if (!interactionStartDocumentRef.current && JSON.stringify(incoming) !== JSON.stringify(playlistHistory.document)) {
      setPlaylistHistory(createPlaylistHistory(makeHistoryState(incoming)));
    }
  }, [tracks, clips, markers, playlistHistory.document]);""", 'history state')
          s = replace_once(s, "        onUpdateClips(clips.map(item => item.id === clip.id ? moved : item));", "        const nextClips = clips.map(item => item.id === clip.id ? moved : item);\n        interactionPreviewDocumentRef.current = createPlaylistDocument(tracks, nextClips, markers);\n        latestDocumentRef.current = interactionPreviewDocumentRef.current;\n        onUpdateClipsProp(nextClips);", 'move preview')
          s = replace_once(s, "        onUpdateClips(clips.map(item => item.id === clip.id ? resized : item));", "        const nextClips = clips.map(item => item.id === clip.id ? resized : item);\n        interactionPreviewDocumentRef.current = createPlaylistDocument(tracks, nextClips, markers);\n        latestDocumentRef.current = interactionPreviewDocumentRef.current;\n        onUpdateClipsProp(nextClips);", 'resize-left preview')
          s = replace_once(s, "        onUpdateClips(clips.map(item => item.id === clip.id ? resized : item));", "        const nextClips = clips.map(item => item.id === clip.id ? resized : item);\n        interactionPreviewDocumentRef.current = createPlaylistDocument(tracks, nextClips, markers);\n        latestDocumentRef.current = interactionPreviewDocumentRef.current;\n        onUpdateClipsProp(nextClips);", 'resize-right preview')
          s = replace_once(s, "    didMoveRef.current = false;\n    event.currentTarget.setPointerCapture(event.pointerId);", "    didMoveRef.current = false;\n    interactionStartDocumentRef.current = currentPlaylistDocument();\n    interactionPreviewDocumentRef.current = interactionStartDocumentRef.current;\n    latestDocumentRef.current = interactionStartDocumentRef.current;\n    event.currentTarget.setPointerCapture(event.pointerId);", 'interaction start')
          s = replace_once(s, "    if (event && event.currentTarget.hasPointerCapture(event.pointerId)) {\n      event.currentTarget.releasePointerCapture(event.pointerId);\n    }\n    setInteraction(null);", "    if (event && event.currentTarget.hasPointerCapture(event.pointerId)) {\n      event.currentTarget.releasePointerCapture(event.pointerId);\n    }\n    if (didMoveRef.current && interactionStartDocumentRef.current && interactionPreviewDocumentRef.current) {\n      const label = interaction?.kind === 'move' ? 'Move Playlist Clip' : 'Resize Playlist Clip';\n      commitPlaylistEdit(interactionPreviewDocumentRef.current, label);\n    }\n    interactionStartDocumentRef.current = null;\n    interactionPreviewDocumentRef.current = null;\n    setInteraction(null);", 'interaction end')
          s = replace_once(s, "  AudioWaveform\n} from 'lucide-react';", "  AudioWaveform,\n  Undo2,\n  Redo2\n} from 'lucide-react';", 'history icons')
          s = replace_once(s, "          {/* Section Markers & Zoom & Add Track */}", "          <div className=\"flex items-center gap-0.5 bg-[#121214] border border-[#333336] p-0.5 rounded\" aria-label=\"Playlist history\">\n            <button type=\"button\" onClick={undoPlaylistEdit} disabled={!playlistHistory.canUndo} title=\"Undo last playlist edit\" className={`px-2 py-0.5 rounded-sm font-semibold text-[10px] flex items-center gap-1 ${playlistHistory.canUndo ? 'text-white hover:bg-[#222225]' : 'text-[#444] cursor-not-allowed'}`}><Undo2 className=\"w-3 h-3\" />Undo</button>\n            <button type=\"button\" onClick={redoPlaylistEdit} disabled={!playlistHistory.canRedo} title=\"Redo last playlist edit\" className={`px-2 py-0.5 rounded-sm font-semibold text-[10px] flex items-center gap-1 ${playlistHistory.canRedo ? 'text-white hover:bg-[#222225]' : 'text-[#444] cursor-not-allowed'}`}><Redo2 className=\"w-3 h-3\" />Redo</button>\n          </div>\n\n          {/* Section Markers & Zoom & Add Track */", 'history toolbar')
          Path('src/components/PlaylistArranger.tsx').write_text(s)
          PY

      - name: TypeScript and focused validation
        run: |
          set -euo pipefail
          npx tsx --test src/state/projectHistory.test.ts src/state/playlistHistory.test.ts src/components/playlistClipOperations.test.ts
          npm run lint
          npm run build

      - name: Commit Phase 8B integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase8b-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlaylistArranger.tsx src/state/playlistHistory.ts src/state/playlistHistory.test.ts .github/workflows/phase8b-finalize.yml
          git commit -m 'Phase 8B: integrate playlist undo and redo'
          git push origin HEAD:phase-8b-playlist-history
