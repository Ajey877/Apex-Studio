# PARKED COPY: the sandbox GitHub App lacks the `workflows` permission, so this
# file could not be pushed to .github/workflows/. To activate it:
#   git mv experiments/audioworklet-wasm-spike/ci/audio-spike.yml .github/workflows/audio-spike.yml

name: Audio Spike (AudioWorklet + WASM, experimental)

# Pre-Phase 1 architecture proof. Runs ONLY when the isolated spike changes.
# It never builds, packages or modifies the production app; it only reads the
# production build output to assert the spike is absent from it.
on:
  pull_request:
    paths:
      - 'experiments/audioworklet-wasm-spike/**'
      - '.github/workflows/audio-spike.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/audioworklet-wasm-spike/**'
      - '.github/workflows/audio-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: experiments/audioworklet-wasm-spike

jobs:
  linux-node-and-chromium:
    name: Linux — WASM unit tests + bundled Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repo dependencies (Playwright, Electron)
        working-directory: .
        run: npm install --legacy-peer-deps
      - name: Install spike dependencies (wabt, pinned)
        run: npm ci
      - name: Production web build (read-only input for isolation test)
        working-directory: .
        run: npm run build
      - name: WASM build is reproducible from source
        run: npm run check:wasm
      - name: Node tests (WASM numerics, mocked-scope processor logic, isolation)
        run: npm run test:node
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser harness — bundled Chromium (headless, Linux)
        if: ${{ !cancelled() }}
        run: node ../../node_modules/@playwright/test/cli.js test --config tests/browser/playwright.config.mjs --project=chromium
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/summarize-results.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: spike-results-linux
          path: experiments/audioworklet-wasm-spike/results

  windows-browsers:
    name: Windows — Google Chrome + Microsoft Edge (installed stable, headed)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repo dependencies
        working-directory: .
        run: npm install --legacy-peer-deps
      - name: Install spike dependencies
        run: npm ci
      - name: WASM build is reproducible from source (Windows)
        run: npm run check:wasm
      - name: Node tests (Windows)
        run: npm run test:node
      - name: Installed browser versions
        shell: pwsh
        run: |
          $chrome = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          foreach ($b in @($chrome, $edge)) { if (Test-Path $b) { "$b : $((Get-Item $b).VersionInfo.ProductVersion)" } else { "$b : NOT FOUND" } }
          Get-CimInstance Win32_Processor | Select-Object -Property Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_SoundDevice | Select-Object -Property Name, Status | Format-List
          Get-Service Audiosrv | Select-Object -Property Name, Status | Format-List
      - name: Browser harness — Google Chrome
        if: ${{ !cancelled() }}
        env:
          SPIKE_HEADED: '1'
        run: node ../../node_modules/@playwright/test/cli.js test --config tests/browser/playwright.config.mjs --project=chrome
      - name: Browser harness — Microsoft Edge
        if: ${{ !cancelled() }}
        env:
          SPIKE_HEADED: '1'
        run: node ../../node_modules/@playwright/test/cli.js test --config tests/browser/playwright.config.mjs --project=msedge
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/summarize-results.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: spike-results-windows-browsers
          path: experiments/audioworklet-wasm-spike/results

  windows-electron:
    name: Windows — Electron (unpackaged + packaged asar)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repo dependencies (pinned Electron)
        working-directory: .
        run: npm install --legacy-peer-deps
      - name: Install spike dependencies
        run: npm ci
      - name: Electron harness — unpackaged (repo electron devDependency, file://)
        if: ${{ !cancelled() }}
        run: node electron/run-electron.mjs
      - name: Stage + package spike-only Electron app (electron-builder --dir, asar)
        if: ${{ !cancelled() }}
        run: |
          node electron/stage-electron-app.mjs
          node ../../node_modules/electron-builder/cli.js --win --x64 --dir --publish never --projectDir results/electron-app
      - name: Electron harness — packaged
        if: ${{ !cancelled() }}
        run: node electron/run-electron.mjs --packaged
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/summarize-results.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: spike-results-windows-electron
          path: |
            experiments/audioworklet-wasm-spike/results/*.json
